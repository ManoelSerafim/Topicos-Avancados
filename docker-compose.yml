services:
  api-topic:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run start:dev

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:4200"
    environment:
      HOME: /tmp
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm start -- --host 0.0.0.0

volumes:
  node_modules:
  ollama-data:
  frontend_node_modules: